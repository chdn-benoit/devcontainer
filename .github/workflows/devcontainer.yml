name: Build Dev Container

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build dev container
        uses: devcontainers/ci@v0.3
        with:
          imageName: ghcr.io/chdn-benoit/devcontainer
          imageTag: latest
          platform: ${{ matrix.platform }}
          useNativeRunner: true
          # The published :latest tag is still the existing amd64 image until the
          # first multi-arch manifest is created. Only the amd64 job can use it.
          cacheFrom: ${{ github.event_name != 'pull_request' && matrix.platform == 'linux/amd64' && 'ghcr.io/chdn-benoit/devcontainer:latest' || '' }}
          push: filter
          refFilterForPush: refs/heads/main
          eventFilterForPush: |
            push
            workflow_dispatch
          runCmd: echo "Dev container built and started"

  manifest:
    name: Publish multi-arch manifest
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Merge platform images
        uses: devcontainers/ci/merge@v0.3
        with:
          imageName: ghcr.io/chdn-benoit/devcontainer
          imageTag: latest
          platforms: linux/amd64,linux/arm64
